name: Midday trail (US)

# Phase 8D — Alpaca side of the trailing-stop pass. Scheduled by
# cron-job.org at ~12:30 ET (mid-US-session) Mon-Fri so we catch the
# "ran in the morning, gave it back at the close" pattern. PATCHes
# bracket-stop children upward on positions in profit.
#
# T212 trail is handled by midday-trail-uk-eu.yml on a different
# schedule (LSE midday is ~12:00 UK, before US even opens).

on:
  workflow_dispatch:

concurrency:
  group: midday-trail-us
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Trail Alpaca stops
        env:
          ALPACA_API_KEY__1: ${{ secrets.ALPACA_API_KEY__1 }}
          ALPACA_API_SECRET__1: ${{ secrets.ALPACA_API_SECRET__1 }}
          ALPACA_API_KEY__2: ${{ secrets.ALPACA_API_KEY__2 }}
          ALPACA_API_SECRET__2: ${{ secrets.ALPACA_API_SECRET__2 }}
          ALPACA_API_KEY__3: ${{ secrets.ALPACA_API_KEY__3 }}
          ALPACA_API_SECRET__3: ${{ secrets.ALPACA_API_SECRET__3 }}
        run: python scripts/midday_trail.py --brokers alpaca --shadow-region us

      - name: Rebuild dashboard
        # The midday-trail step can close shadow/broker positions and
        # add their P&L to the ledger. Without this rebuild, docs/data.json
        # stays frozen at whatever snapshot the last pipeline run wrote,
        # so today_pnl_gbp for the US region reads 0 even when the
        # midday TPs (often the day's biggest winners) actually fired.
        run: python -m trading_bot.dashboard.build || echo "dashboard build failed (non-fatal)"

      - name: Commit ledger changes back
        # Shadow midday TP and broker-side trail mutations touch
        # state/ledger.jsonl + state/trail_exits.jsonl on the runner.
        # Without this step those mutations vanish when the runner
        # terminates, so shadow midday exits effectively never persist.
        run: |
          git config user.name "trading-bot[bot]"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state/ledger.jsonl state/trail_exits.jsonl docs/data.json || true
          if git diff --cached --quiet; then
            echo "No ledger mutations; skipping commit"
            exit 0
          fi
          git commit -m "midday trail (us) — $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            strategy=""
            if [ "$i" -gt 1 ]; then
              strategy="-X theirs"
            fi
            if git pull --rebase --autostash $strategy origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Could not push after 3 attempts"
          exit 1

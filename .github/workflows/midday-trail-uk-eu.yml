name: Midday trail (UK/EU)

# Phase 8D — T212 side of the trailing-stop pass. Scheduled by
# cron-job.org at ~12:00 UK (mid-LSE-session) Mon-Fri. T212's
# Invest API doesn't expose PATCH on stops; we cancel-and-replace
# any existing stop with a higher one when the position's in profit.
#
# Alpaca trail is handled by midday-trail-us.yml on a later schedule
# (mid-US-session is hours later).

on:
  workflow_dispatch:

concurrency:
  group: midday-trail-uk-eu
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Trail T212 stops
        env:
          T212_API_KEY__1: ${{ secrets.T212_API_KEY__1 }}
          T212_API_SECRET__1: ${{ secrets.T212_API_SECRET__1 }}
          T212_API_KEY__2: ${{ secrets.T212_API_KEY__2 }}
          T212_API_SECRET__2: ${{ secrets.T212_API_SECRET__2 }}
          T212_API_KEY__3: ${{ secrets.T212_API_KEY__3 }}
          T212_API_SECRET__3: ${{ secrets.T212_API_SECRET__3 }}
        run: python scripts/midday_trail.py --brokers t212 --shadow-region uk-eu

      - name: Rebuild dashboard
        # The midday-trail step can close shadow/broker positions and
        # add their P&L to the ledger. Without this rebuild, docs/data.json
        # stays frozen at whatever snapshot the last pipeline run wrote,
        # so today_pnl_gbp for the UK-EU region misses midday TPs.
        run: python -m trading_bot.dashboard.build || echo "dashboard build failed (non-fatal)"

      - name: Commit ledger changes back
        # Shadow midday TP and broker-side trail mutations touch
        # state/ledger.jsonl + state/trail_exits.jsonl on the runner.
        # Without this step those mutations vanish when the runner
        # terminates, so shadow midday exits effectively never persist.
        run: |
          git config user.name "trading-bot[bot]"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state/ledger.jsonl state/trail_exits.jsonl docs/data.json || true
          if git diff --cached --quiet; then
            echo "No ledger mutations; skipping commit"
            exit 0
          fi
          git commit -m "midday trail (uk-eu) — $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            strategy=""
            if [ "$i" -gt 1 ]; then
              strategy="-X theirs"
            fi
            if git pull --rebase --autostash $strategy origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Could not push after 3 attempts"
          exit 1

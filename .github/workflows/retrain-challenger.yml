name: Retrain ml-challenger

# Monthly walk-forward retrain of the ML challenger using EXACTLY the
# deployed data recipe: a fresh ~3-year training snapshot backfilled
# per region (state/ml/train.db — the runtime OHLCV cache is never
# used for training; it is capped at ~250 sessions with organic
# coverage) and rolling-250-session training windows, matching the
# committed models' cards and the depth-vs-recency ablation
# (model/us/ablation.json). Promotion gate: the fresh model is
# committed only if its pooled OOS rank-IC Fisher-z lower bound is >=
# the current card's value − 0.002 (tolerance sized to the LB scale,
# ~0.002–0.014); otherwise the old artifacts are restored and an
# issue is opened with the metric diff. Mirrors the bot's human-gated
# promotion philosophy.
#
# The GH Actions scheduler is unreliable for time-critical crons (the
# dailies run via cron-job.org) but a monthly retrain has no deadline,
# so `schedule` is fine here alongside manual dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st — off the :00 stampede

concurrency:
  group: retrain-challenger
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python package (+ml extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"

      - name: Backfill training snapshot (both regions + ^VIX)
        run: |
          python -m trading_bot.ml.data backfill --region us
          python -m trading_bot.ml.data backfill --region uk-eu

      - name: Data audit
        run: python -m trading_bot.ml.data audit

      # Both regions retrain sequentially in one job — parallel matrix
      # jobs would race each other on the push. Each region gates
      # independently: a us promotion is never blocked by a uk-eu
      # regression, and vice versa.
      - name: Snapshot current metrics
        run: |
          for region in us uk-eu; do
            cp "strategies/ml-challenger/model/$region/metrics.json" "/tmp/old_metrics_$region.json" 2>/dev/null \
              || echo '{}' > "/tmp/old_metrics_$region.json"
          done

      - name: Walk-forward train + promotion gate (per region)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          any_promoted=1
          for region in us uk-eu; do
            echo "=== $region ==="
            if ! python -m trading_bot.ml.train --db state/ml/train.db \
                --region "$region" --train-window-sessions 250; then
              echo "$region: training failed — skipping"
              git checkout -- "strategies/ml-challenger/model/$region" 2>/dev/null || true
              continue
            fi
            set +e
            python scripts/ml_retrain_gate.py \
              --old "/tmp/old_metrics_$region.json" \
              --new "strategies/ml-challenger/model/$region/metrics.json" \
              --tolerance 0.002 | tee "/tmp/gate_$region.md"
            verdict=${PIPESTATUS[0]}
            set -e
            if [ "$verdict" != "0" ]; then
              git checkout -- "strategies/ml-challenger/model/$region"
              gh issue create \
                --title "ml-challenger $region retrain rejected by promotion gate ($(date -u +%Y-%m-%d))" \
                --body-file "/tmp/gate_$region.md"
            else
              any_promoted=0
            fi
          done
          echo "promote=$any_promoted" >> $GITHUB_OUTPUT

      - name: Commit promoted model
        if: steps.gate.outputs.promote == '0'
        run: |
          git config user.name "trading-bot[bot]"
          git config user.email "trading-bot@users.noreply.github.com"
          git add strategies/ml-challenger/model
          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi
          MSG="ml-challenger monthly retrain — $(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "$MSG"
          # Same rebase-retry loop the state-committing workflows use.
          # No smart-merge fallback needed: nothing else writes to
          # strategies/ml-challenger/model, so a rebase always succeeds
          # unless the branch itself moved mid-push.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed; retrying..."
            sleep 3
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1

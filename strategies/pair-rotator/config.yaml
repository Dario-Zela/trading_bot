id: pair-rotator
display_name: Sector pair rotator
description: "Long-short sector pair strategy on GBP-denominated LSE-listed ETFs.\n\
  Picks one long sector ETF (the strongest cross-sectional momentum) +\none inverse\
  \ / hedge ETF position to neutralise market beta. The\ntrade extracts the cross-sectional\
  \ sector spread rather than market\ndirection, which means it should produce return\
  \ that's structurally\nuncorrelated with the rest of the slate (all of which are\n\
  long-only and fully market-exposed when deployed).\n\nAxis broken: EXPOSURE. Everything\
  \ else in the slate runs long-only\nwith +1.0 market beta when fully invested; this\
  \ strategy targets\nnet market beta near zero. Even if its standalone Sharpe is\
  \ modest,\nits low correlation with the rest of the slate is what makes it\nvaluable\
  \ to the tournament \u2014 distinguishability on the leaderboard.\n\nUniverse is\
  \ eu_etfs_sector + selected inverse / hedge ETFs from\neu_etfs_bond and eu_etfs_commodity\
  \ (gold, gilts) so the LLM can\npick a true hedge when no inverse-sector ETF matches\
  \ the laggard\nsector cleanly.\n"
implementation: llm
active: false
capital_gbp: 8000
max_positions: 4
max_position_pct: 30
min_position_gbp: 100
use_stops: true
use_take_profits: true
stop_loss_pct: -4.0
take_profit_pct: 3.0
last_tune_date: '2026-06-20'
tools:
- get_universe
- get_history
- get_technicals
- get_sector_strength
- get_macro_view

id: sector-rotator
display_name: Sector rotator
description: "LLM-driven. Trades sector ETFs based on relative momentum and macro\n\
  alignment. US: SPDR sector ETFs (XLF, XLE, XLK, ...). UK/EU: GBP-\ndenominated iShares\
  \ MSCI Europe sector ETFs (ESIF.L, ESIT.L, ...) \u2014\nGBP avoids the FX fee the\
  \ older EUR STOXX-600 lines carried. Same\nstrategy bias, different ETF universe\
  \ per region.\n"
implementation: llm
active: true
capital_gbp: 10000
max_positions: 4
max_position_pct: 40
